<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>全景总览 · 设计研究</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/vfx.css">
</head>
<body>
<div class="doc is-wide" data-page>
  <div data-vfx-root="overview">
    <header class="vfx-head">
      <h2>全景总览</h2>
      <p>按视效语言看高阶标杆。格子里是小缩略图；把指针放上去，可以看到放大截图、名称、来源和所属场景。点卡片或浮卡上的链接，打开原站。</p>
    </header>
    <div class="vfx-toolbar">
      <div class="label">按场景筛选</div>
      <div class="vfx-tabs" data-vfx-tabs></div>
    </div>
    <div data-vfx-grid></div>
    <p class="vfx-note">「已掌握 / 点亮」这一层还在等约 100 条自身现状名单。目前没有点亮数据，地图上不会标注已掌握。</p>
  </div>
</div>
</body>
</html>
